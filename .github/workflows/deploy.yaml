---
name: 🚀 Deploy
"on":
  workflow_dispatch:
  # The deploy token carries a one-year TTL, and every other trigger here is a push.
  # A quiet month therefore never exercises the token, so its expiry would surface
  # only whenever the next article happens to land. A monthly run turns that silence
  # into a failed workflow and an email, and re-proves the build against whatever uv
  # and npm resolve that month. Offset from the 1st so it does not collide with the
  # monthly tests.yaml run.
  schedule:
    - cron: "43 6 15 * *"
  # Only deploy the reference default branch.
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "wrangler.toml"
      - ".github/workflows/deploy.yaml"

permissions: {}

# A deploy is a race between pushes, not a queue: two commits landing minutes apart
# would otherwise upload two builds and let whichever wrangler finishes last decide
# what is live. Cancelling is safe because Cloudflare Pages only activates a
# deployment once the upload completes, so an interrupted run leaves the previous
# one serving.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Same supply-chain cooldown as tests.yaml, and for a stronger reason: this is the
# workflow whose output reaches readers. Nothing published inside the window can be
# resolved by uv, npm or npx below. Held equal to `[tool.uv] exclude-newer` and
# `[tool.repomatic] minimum-release-age`; see claude.md.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  # Cloudflare holds settings that no file in this repository can express: the
  # compatibility date, Smart Placement, the build image floor. They are invisible
  # until they misbehave, and the project spent years with a `wrangler.toml`
  # compatibility date three years out of step with the live one without anyone
  # noticing. This job fails the run when the live project stops matching what
  # docs/infrastructure.md declares. It is deliberately a separate job: drifted
  # settings should be loud, but they should never hold up publishing an article.
  config-drift:
    name: Check Cloudflare config drift
    # Same image as the deploy job below, where the reasoning sits.
    runs-on: ubuntu-26.04
    # Two Cloudflare API calls and a TOML parse. A minute is already luxurious; 10
    # covers an API that is answering slowly rather than not at all.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Standard library only, so no uv sync and no dependency cooldown to honour.
      # Needs Python 3.11 or later for tomllib; ubuntu-26.04 ships 3.14.
      - name: Compare live project against declared state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          python3 scripts/cloudflare_config.py --check

  deploy:
    name: Deploy to Cloudflare Pages
    # x64 because it was measured, not assumed. arm64 ran this same job green on
    # 2026-08-11, so the architecture is not a compatibility problem: jampack's
    # libvips bindings, the Stork compile and the whole Pelican build all work. It
    # is simply slower where this job spends its time.
    #
    #                    x64     arm64
    #   Install Stork     66s      52s   arm64 faster, Rust compiles well on it
    #   Generate content 386s     441s   arm64 14% slower, and this is 70% of the job
    #   Optimize          90s      78s   arm64 faster
    #
    # The two wins total 26s and the loss is 55s, so arm64 costs about half a minute
    # per deploy. tests.yaml saw the same shape independently (427s against 386s),
    # which is what makes it a result rather than runner noise: single-threaded
    # Python is the one thing these arm64 runners do worse, and it is the one thing
    # this job mostly does.
    #
    # Worth revisiting only if the build stops dominating. Note that no updater walks
    # a `runs-on:` value forward the way sync-workflow-pins walks the version pins
    # below, so the architecture stays a hand-held choice.
    #
    # 26.04 rather than 24.04 since 2026-08-14, x64 to x64, so the table above still
    # describes this job. The image ships Python 3.14.4, Rust 1.97.1 and npm 11.17.0,
    # which covers everything the steps below reach for before they pin their own.
    # The version, unlike the architecture, is now watched: 26.04 is one of the images
    # repomatic draws its test axes from, and the runner-images job files an issue when
    # GitHub's announcement feed puts one of those into deprecation. 24.04 sat outside
    # that list, so its retirement would have surfaced as a broken deploy instead.
    runs-on: ubuntu-26.04
    # Measured at roughly 10 minutes end to end from the table above, and it is the
    # workflow whose output reaches readers, so the cap is set to absorb a bad day
    # rather than to be tight. What it rules out is a wedged step holding a runner for
    # the platform's 6-hour default while nothing is being published.
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.2"
      # Plumage's webassets pipeline shells out to npm to install its PostCSS
      # toolchain, so the theme cannot build without it. Same step as tests.yaml,
      # including the pin: the apt package this replaced was npm 9.2.0, four major
      # versions below the 11.10.0 that first understood `min-release-age`, so the
      # cooldown this workflow declares was not being applied to a single npm
      # install. On the workflow whose output reaches readers, that is the one
      # that mattered most.
      - name: Install npm
        run: >
          npm install npm@12.0.2 --global --ignore-scripts --no-progress
          --no-update-notifier --no-fund --no-audit
      # Version-pinned because `--locked` does not do it: that flag freezes the
      # crate's own dependency tree and leaves the crate itself resolved fresh on
      # every run. Two reasons to hold it. Plumage hardcodes the runtime the page
      # loads, `files.stork-search.net/releases/v1.6.0/stork.js` in its
      # `base.html`, and the index format is versioned, so an indexer that moved
      # ahead of that runtime would leave site search returning nothing with no
      # build error to show for it. And cargo reads neither UV_EXCLUDE_NEWER nor
      # NPM_CONFIG_MIN_RELEASE_AGE, which makes this the one install in either
      # workflow that no cooldown covers.
      #
      # 1.6.0 is what an unpinned cargo resolves today anyway: it is the newest
      # stable, from 2023-01-30, and 2.0.0-beta.2 is a prerelease cargo skips. So
      # the pin changes nothing now and holds the line if a 2.0.0 ever ships.
      # Nothing walks it forward either, sync-workflow-pins matching npm, PyPI
      # and setup-uv literals but not cargo, so it is hand-held like `runs-on:`.
      - name: Install Stork
        run: >
          cargo install stork-search --version 1.6.0 --locked
      # No separate `uv venv` and `uv sync`: `uv run` creates and syncs the
      # environment itself, and doing it in one command is what keeps `--frozen` on
      # the step that actually resolves. A bare `uv sync` ahead of it could re-lock.
      - name: Generate static content
        run: >
          uv --no-progress run --frozen --all-extras --
          pelican --extra-settings SITEURL='"https://kevin.deldycke.com"'
      - name: "XXX Temporarily remove files >25 MiB"
        # See: https://developers.cloudflare.com/pages/get-started/direct-upload/#limits
        run: |
          rm -f ./output/2020/HP_Color_LaserJet_Pro_M254_dw_Printer_series_20200612.rfu
      # Version-pinned like the html-validate call in tests.yaml. An unpinned `npx`
      # resolves whatever is newest at deploy time, which is the one moment a
      # surprise is least welcome.
      - name: Optimize
        run: >
          npx --yes @divriots/jampack@0.34.1 ./output
      # The SHA pins the action, not the CLI it installs. Left to itself the
      # action falls back to its own default of `4` and runs `npm i wrangler@4.119.0`,
      # so the tool that uploads the site would be whatever 4.x happens to be
      # current that morning. The install does inherit the cooldown, npm having
      # been upgraded above and NPM_CONFIG_MIN_RELEASE_AGE being set at workflow
      # level, but a week-old release nobody picked is still nobody's choice.
      # 4.118.0 is what that floating range resolves to today, so the pin starts
      # as a no-op. Hand-held like the Stork pin: sync-workflow-pins reads npm and
      # PyPI literals and setup-uv's version input, not a `with:` input here.
      - name: Publish
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./output --project-name=kevin-deldycke-blog --commit-dirty=true
          wranglerVersion: "4.118.0"
