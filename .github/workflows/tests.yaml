---
name: 🔬 Tests
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tests.yaml
      - content/**
      - pelican_patches.py
      - pelicanconf.py
      - pyproject.toml
      - tests/**
      - uv.lock
  pull_request:
    branches-ignore:
      # This filter matches the PR's *base* branch (always `main`), not its
      # head, so it does not actually exclude these PRs: see
      # https://github.com/actions/runner/issues/1591. Kept here as
      # documentation of intent, since the skip only becomes real through a
      # `github.head_ref` check on a job's `if:`, propagated through `needs:`.
      # Named no more precisely than that because `repomatic init
      # workflows/tests.yaml` copies this header into downstream repos, which
      # own their jobs and carry no `metadata` job for it to point at.
      - major-version-increment
      - minor-version-increment
      - prepare-release
    paths:
      - .github/workflows/tests.yaml
      - content/**
      - pelican_patches.py
      - pelicanconf.py
      - pyproject.toml
      - tests/**
      - uv.lock
  schedule:
    # Run tests monthly to catch regressions from dependency or environment changes.
    - cron: "17 9 1 * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  test-generation:
    name: Generate the static site
    # Same architecture as the deploy job, deliberately: this job is what covers that
    # build, so a break here has to show up before a push reaches readers.
    #
    # arm64 was tried on 2026-08-11 and reverted. It was never a compatibility
    # problem, and nothing in the lockfile is x64-only: of 71 packages, 63 are pure
    # Python, 5 ship aarch64 wheels, and the 3 with no wheel at all (cssmin, rtoml,
    # typogrify) already compile from source everywhere. It ran green. It was just
    # slower at the part that matters, taking 427s to build the site against 386s
    # here, with deploy.yaml measuring the same gap on its own run. arm64 wins on the
    # Rust and libvips steps and loses on single-threaded Python, and this job is
    # mostly single-threaded Python. See the table in deploy.yaml.
    #
    # ubuntu-slim cannot run this at all: it ships no Rust, which `cargo install
    # stork-search` and the rtoml build both need, and repomatic has since retired it
    # from its axes. 26.04 was the one worth revisiting, for its Python 3.14 rather
    # than its OS, and the blocker cleared on 2026-08-14: lxml, markupsafe, pyyaml and
    # watchfiles all ship cp314 wheels at the versions uv.lock pins (6.1.1, 3.0.3,
    # 6.0.3, 1.2.0), so none of them falls back to compiling from source. The move is
    # x64 to x64, which leaves the arm64 measurement above untouched.
    #
    # Note that no updater walks a `runs-on:` value forward the way
    # sync-workflow-pins walks the version pins in the steps below, so this is still a
    # hand-held choice. What 26.04 buys is the warning: it is one of the images
    # repomatic draws its test axes from, and the runner-images job files an issue
    # when GitHub's announcement feed puts one of those into deprecation. 24.04 sat
    # outside that list, so this image retiring would have arrived unannounced.
    runs-on: ubuntu-26.04
    # The site build is the long pole here at roughly 6 minutes, and html-validate
    # walks 262 articles after it. 30 leaves room for a slow runner without letting a
    # hung step hold the slot for the platform's 6-hour default. repomatic caps every
    # job it owns the same way, but this workflow owns its jobs, so nothing is
    # inherited.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      # Plumage's webassets pipeline shells out to npm to install its PostCSS
      # toolchain, so the theme cannot build without it. The runner already ships
      # Node and npm, so this upgrades in place rather than installing from apt,
      # which pulled npm 9.2.0 on Node 18 out of Ubuntu noble. That mattered for
      # more than age: npm only understands `min-release-age` from 11.10.0 on, so
      # the NPM_CONFIG_MIN_RELEASE_AGE above was silently doing nothing and every
      # npm install this workflow made ran with no cooldown at all.
      #
      # Pinned the way setup-uv pins uv, and in the shape repomatic's
      # sync-workflow-pins recognises: `npm@X.Y.Z` has to sit immediately after
      # `install` with every flag trailing, or its regex misses the literal and
      # the version silently stops being bumped. The cooldown itself comes from
      # the workflow-level env, which npm reads as its `min-release-age` config.
      - name: Install npm
        run: >
          npm install npm@12.0.2 --global --ignore-scripts --no-progress
          --no-update-notifier --no-fund --no-audit
      # Pinned as in deploy.yaml, where the reasoning sits: `--locked` freezes the
      # crate's dependencies rather than the crate, cargo honours neither cooldown
      # variable, and the indexer has to keep producing the format the runtime
      # Plumage loads can read.
      - name: Install Stork
        run: >
          cargo install stork-search --version 1.6.0 --locked
      - name: Build website
        run: >
          uv --no-progress run --frozen --all-extras -- pelican
      # Checks what Pelican renders, which is the half djlint cannot reach: it
      # lints the Jinja sources over in the plumage repo, and a template that
      # lints clean can still emit broken markup once content is poured into
      # it. Reuses the build above rather than repeating it, which is what the
      # old lint-html job did for a third time.
      #
      # Version-pinned like plumage pins djlint. Feeds are named feed.rss and
      # feed.atom, so the .html glob already leaves them out and the old job's
      # feed filter has nothing left to do. The glob is quoted because
      # html-validate expands it itself, recursively.
      #
      # Not gating yet, and deliberately so: the default `recommended` preset
      # bundles the WCAG rules, so every pre-2010 post missing an image alt is
      # an error on the first run. That is a backlog, not a regression, and
      # burying a real defect under it helps nobody. Drop continue-on-error
      # once the count reaches zero and this starts failing like any other step.
      - name: Validate generated HTML
        continue-on-error: true
        run: >
          npx --yes html-validate@11.11.0 './output/**/*.html'

  unittests:
    name: Unittests
    # Same image as the job above, for the same reasons.
    runs-on: ubuntu-26.04
    # The suite is mostly live HTTP against production, so it is bounded by how long
    # those hosts take to answer rather than by anything local. 15 is generous against
    # a run that finishes in well under a minute, and still caps a hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      # No path argument: pytest discovers everything under tests/, so a new test file is
      # picked up without editing this workflow. Naming one file here is how the local
      # Pelican patches went untested in CI for as long as they did.
      - name: Unittests
        run: >
          uv --no-progress run --frozen --all-extras -- pytest
