[[comment]]
article = "2011/nichrome-preview-behind-the-scene-video"
id = 769313012
parent = 769313009
author = "Kevin Deldycke"
wp_id = 9675
date = 2011-12-22T18:08:00Z
body = '''
[@djib](#comment-769313009): I'm glad you posted this comment ! Motion sickness is a subject I wanted to talk about in this post. But in the process of writing it I leaved it behind !

You're right about the framing and camera movements of this video: while very dynamic, they don't induce motion sickness... on YouTube. But try to project this video on a big screen and it's another story. I haven't detected this difference until the video was released.

This [phenomenon](https://en.wikipedia.org/wiki/Motion_sickness#Motion_sickness_due_to_films_and_other_video) is not new, and I was aware of it. But I didn't fully grasps how important it was until I experienced it.

I think I've learned a really important lesson (`http://www.lavideofilmmaker.com/filmmaking-questions/directing-shooting-and-editing-projects-for-the-web-vs-the-big-screen.html`) on that project, and it will help me craft my shots more carefully on future productions. On the other hand, I'm now confident I can abuse camera movements without making the video uncomfortable if the target is the web.
'''

