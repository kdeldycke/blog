# Moving a Git sub-tree to its own repository

[[comment]]
article = "2011/moving-git-subtree-repository"
id = 769312439
author = "Kevin Deldycke"
wp_id = 8536
date = 2011-03-24T12:25:00Z
body = '''
About the ultimate clean-up mentionned at the very end of the post, here is how I removed the plugin code from its original repository (with some tips from [Cedric](https://twitter.com/cedricgirard)):

```bash
git clone git@github.com:kdeldycke/kev-code.git
cd kev-code
git filter-branch         --prune-empty --index-filter 'git rm -rf --cached --ignore-unmatch e107-importer              ' -- --all
git filter-branch --force --prune-empty --index-filter 'git rm -rf --cached --ignore-unmatch wordpress-e107-importer.php' -- --all
git tag -d e107-importer-0.1 e107-importer-0.2 e107-importer-0.3 e107-importer-0.4 e107-importer-0.5 e107-importer-0.6 e107-importer-0.7 e107-importer-0.8 e107-importer-0.9
git remote rm origin
rm -rf .git/refs/original/
git reflog expire --all
git gc --aggressive --prune
```

After all these steps, I deleted my repository on GitHub and recreated it. This is quite brutal and dangerous, but was the only way I found to force all caches to be cleared on GitHub side.

After this re-initialisation, I pushed my local cleaned repository back to its new GitHub home:

```bash
git remote add origin git@github.com:kdeldycke/kev-code.git
git push origin master --force --tags
```
'''

[[comment]]
article = "2011/moving-git-subtree-repository"
id = 769312442
author = "Kevin Deldycke"
wp_id = 8553
date = 2011-03-29T11:42:00Z
body = '''
Practicing this process several times last week, I just found a better way to migrate a subtree to its own subdirectory.

Here is an example with [my Sapphire theme](https://github.com/kdeldycke/sapphire):

```bash
git clone git@github.com:kdeldycke/kev-code.git
cd kev-code
git filter-branch --prune-empty --subdirectory-filter sapphire --tag-name-filter cat -- --all init..HEAD
git tag -d coolkevmen-0.3 cool-blue-0.1
git remote rm origin
rm -rf .git/refs/original/
git reflog expire --all
git gc --aggressive --prune
git filter-branch --force --env-filter \
  'if [ $GIT_COMMIT = 0a247ae0f4202813d6a019964d57521f8b7f67cf ]
     then
       export GIT_AUTHOR_DATE="Thu, 01 Jan 1970 00:00:00 +0000"
       export GIT_COMMITTER_DATE="Thu, 01 Jan 1970 00:00:00 +0000"
   fi' -- --all
git remote add origin git@github.com:kdeldycke/sapphire.git
git push -u origin master --force --tags
```

This worked well for several reasons.

First, unlike the `e107-importer` plugin discussed in my original article above, my theme was always living in its own `sapphire` folder. This mean I was able to use the straightforward `--subdirectory-filter` parameter instead of a convoluted `--tree-filter`.

Second, I was able to specify the `init..HEAD` range, which is only possible because of [the way I initialize my repositories](https://kevin.deldycke.com/2010/initialize-git-repositories). And giving this range to Git has the nice effect of discarding the strange branching coming from a [previous CSV import](https://kevin.deldycke.com/2010/how-to-fork-cvs-project-git).

And lastly, I discovered that I can simultaneously apply a `--tag-name-filter` parameter, which saved all tags removed while specifying the branch interval as explained in the paragraph above.
'''

[[comment]]
article = "2011/moving-git-subtree-repository"
id = 769312443
author = "Kevin Deldycke"
wp_id = 8554
date = 2011-03-29T11:47:00Z
body = '''
Oh, and I stumble upon another annoying issue. Moving my `cool-cavemen` subfolder to its own repository was working using the method above. Alas, this sub-project was using some references to Git modules, which were lost in the process.

[Like *Unode* from Stack Overflow](https://stackoverflow.com/questions/3411364/splitting-a-subdirectory-with-submodules-into-a-separate-git-repository), I managed to keep the `.gitmodules` file and rewrite its content with some `sed` commands. But old module's folders were not moved up to one level in the folder hierarchy.

After some experiments, I came with this simple strategy of temporarily renaming the `.gitmodules` file to get rid of this side effect. Here is the full detailed process which helped me keep everything clean and tidy:

```bash
git clone git@github.com:kdeldycke/kev-code.git
cd kev-code
git filter-branch --tree-filter "test -f ./.gitmodules && mv ./.gitmodules ./cool-cavemen/gitmodules || echo 'No .gitmodules file found'" -- --all
git filter-branch --force --prune-empty --subdirectory-filter cool-cavemen --tag-name-filter cat -- --all init..HEAD
git filter-branch --force --tree-filter "test -f ./gitmodules && mv ./gitmodules ./.gitmodules || echo 'No gitmodules file found'" -- --all
git filter-branch --force --tree-filter "test -f ./.gitmodules && sed -i 's/cool-cavemen\///g' ./.gitmodules || echo 'No .gitmodules file found'" -- --all
git tag -d coolkevmen-0.3 cool-blue-0.1 sapphire-0.1 sapphire-0.2 sapphire-0.3 sapphire-0.4
git remote rm origin
rm -rf .git/refs/original/
git reflog expire --all
git gc --aggressive --prune
git filter-branch --force --env-filter \
  'if [ $GIT_COMMIT = 0a247ae0f4202813d6a019964d57521f8b7f67cf ]
     then
       export GIT_AUTHOR_DATE="Thu, 01 Jan 1970 00:00:00 +0000"
       export GIT_COMMITTER_DATE="Thu, 01 Jan 1970 00:00:00 +0000"
   fi' -- --all
git remote add origin git@github.com:kdeldycke/cool-cavemen.git
git push -u origin master --force --tags
```
'''

