[[comment]]
article = "2007/how-to-grow-any-qemu-system-image"
id = 769310448
parent = 769310435
author = "Bruno"
wp_id = 3198
date = 2007-10-18T19:38:00Z
body = '''
For details on "A disk read error has occurred." please check this post: [http://qemu-forum.ipi.fi/viewtopic.php?p=12362](https://web.archive.org/web/20071225081948/http://qemu-forum.ipi.fi:80/viewtopic.php?p=12362)

The complete procedure would now be

1- Convert to a raw image

```bash
qemu-img convert system.qcow -O raw system.raw
```

2- Increase the size of the raw image

```bash
dd if=/dev/zero of=system.raw seek=N obs=1GB count=0
```

where `N` is the number of GigaBytes

3- Fix the NTFS BPB
Edit the raw file: `hexedit system.raw`
Goto to offset 7E00: `7E00`
Change 80 to FF at offset 7E1A and save: `FF --> Ctrl-x --> y`

4- Boot Windows and check that you see a bigger disk in the admin tools

```bash
qemu hda system.raw
```

5- Use (fantastic) gparted to resize your NTFS partition

```bash
qemu -hda system.raw -cdrom gparted-livecd-0.3.4-5.iso -boot d
```

6- Boot windows to check and perform a `chkdsk`

```bash
qemu hda system.raw
```

7- If you need to save space, convert back to qcow

```bash
qemu-img convert system.raw -O qcow growed-system.qcow
```
'''

[[comment]]
article = "2007/how-to-grow-any-qemu-system-image"
id = 769310444
author = "Luca"
wp_id = 3122
date = 2007-08-29T21:08:00Z
body = '''
If you have the image in a raw file and the host filesystem is supporting files with holes a simpler, quicker and less space-wasting way to increase your virtual disk size is:

```bash
dd if=/dev/zero of=system.raw bs=1 count=1 seek=10G
```

In this way `dd` leaves a hole of 10G from the beginning of the file (leaving everything untouched) and then writes a 0.
'''

[[comment]]
article = "2007/how-to-grow-any-qemu-system-image"
id = 769310479
parent = 769310444
author = "Mark"
wp_id = 7142
date = 2010-05-12T21:58:00Z
body = '''
There's a better way to do the data append than by creating huge files and cat'ing them together...try this to use sparse files and save a bunch of space:

```bash
dd if=/dev/zero of=system.raw bs=1 count=1 seek=$((  - 1 )) conv=notrunc
```
'''

[[comment]]
article = "2007/how-to-grow-any-qemu-system-image"
id = 769310514
parent = 769310479
author = "Brian"
wp_id = 10878
date = 2012-10-24T20:29:00Z
body = '''
Regarding combining the `dd` and the `cat` into one statement, you can change

```bash
dd if=/dev/zero of=zeros.raw bs=1024k count=4096
cat system.raw zeros.raw > big10G.raw
```

Into

```bash
dd if=/dev/zero bs=1024k count=4096 >> system.raw
```

The absence of an `of=` parameter makes `dd` direct its output to `STDOUT`, which `>>` then appends to your existing file. I've tested it and it works for me, but as always, make sure you have a backup. In particular, typing `>` instead of `>>` would wipe your file.
'''

