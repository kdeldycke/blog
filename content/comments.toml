[[comment]]
article = "2010/automate-trac-instance-deployment-buildout"
id = 769312295
parent = 769312289
author = "Kevin Deldycke"
wp_id = 8608
date = 2011-04-14T16:44:00Z
body = '''
[@Syd](#comment-769312289): I just updated my article regarding the `htdigest`.

As for the `python-svn` package, you are right, [Trac needs Subversion's Python bindings](https://trac.edgewall.org/wiki/TracInstall#Subversion). But these bindings are named `subversion-python` on RedHat and `python-subversion` on Debian/Ubuntu. OTOH, `python-svn` hold [PySVN](https://web.archive.org/web/20110409072214/http://pysvn.tigris.org/), not `libsvn`'s bindings. I just updated my article accordingly.

Thanks Syd for these observations ! :)
'''

