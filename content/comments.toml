author = "aaki"
wp_id = 10824
date = 2012-07-13T00:38:00Z
body = '''
Yah, had the same problem here. Make sure that the `root` directive is in your `server` block and NOT in your `location` block. Check the nginx pitfalls: [http://wiki.nginx.org/Pitfalls](https://web.archive.org/web/20120717221341/http://wiki.nginx.org:80/Pitfalls).
'''

[[comment]]
article = "2011/nginx-php-fpm-mysql-debian-squeeze-server"
id = 769312879
parent = 769312875
author = "Vivek"
wp_id = 10898
date = 2012-11-24T21:15:00Z
body = '''
Hey Kevin , Thanks a lot for the guide , it works great but there's a small mistake the directives file for `example.com` in `sites-available` folder should be like this

```nginx
server {
  server_name example.com;
  root /var/www/example.com/;
 include /etc/nginx/php.conf;
  location / {
    root /var/www/example.com/;
    access_log on;
  }
}
```

ie. the `root` directive should also be in `server` part else it shows 404 , rest everything is working superb , please update it in your post to prevent 404's for future readers of your post
'''

[[comment]]
article = "2011/nginx-php-fpm-mysql-debian-squeeze-server"
id = 769312883
parent = 769312879
