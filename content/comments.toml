article = "2012/ultimate-gmail-backup-gmvault"
id = 769313246
author = "djib"
wp_id = 10875
date = 2012-10-24T11:36:00Z
body = '''
Why don't you use Archivemail?

Here's how I archive my Trash box at the end of each year:

```bash
archivemail --date=2010-01-01 -p archive- -s -2009 -o . imap://djib@[provider].com@[imap_server].com/INBOX.Trash
```

That creates a mbox file called `archive-INBOX.Trash-2009` in my current folder (and deletes the corresponding email in my remote box, though that can be changed).
'''

