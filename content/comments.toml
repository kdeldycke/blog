# Displaying Upcoming Events from a Google Calendar in Javascript

[[comment]]
article = "2012/displaying-upcoming-events-google-calendar-javascript"
id = 769313192
author = "Franz"
wp_id = 10851
date = 2012-09-17T10:23:00Z
body = '''
Good job! Really useful.

You have to fix

```js
... d.getMonth() + '-' + d.getDate() ...
```

, and +1 each one, cause is an array that starts at `0`.

Plus, if add this little piece of code before declaration of `var d`, it could be more friendly :D

```js
// Change Months Numbers for Months
var monthName = new Array (12);
month[1]="January";
month[2]="February";
month[3]="March";
month[4]="April";
month[5]="May";
month[6]="June";
month[7]="July";
month[8]="August";
month[9]="September";
month[10]="October";
month[11]="November";
month[12]="December";
```

And then in the code we change

```js
... (d.getMonth()+1) ...
```

for

```js
monthName[(d.getMonth()+1)]
```

(Same applies for Days, just more lines)
'''

