# Remote Backup with rsync

[[comment]]
article = "2005/remote-backup-with-rsync"
id = 769308645
author = "Kevin Deldycke"
wp_id = 4762
date = 2009-02-23T13:57:00Z
body = '''
If you decided to setup an unattended backup using `cron` and passphrase-less key (last step of the tutorial above), then you should check that passwordless connection to the backup server work. Here is the command:

```bash
ssh kevin@homeserver.com
```

If you're unlucky (like I was yesterday), the destination server will still ask you for a password. In that case, check the owner of `~/.ssh` folder on `homeserver.com`: it must be `kevin` (else SSH can't read the `~/.ssh/authorized_keys`).
'''

