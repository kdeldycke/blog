# Setup a lightweight IMAP server on Mac OS X Leopard with Dovecot

[[comment]]
article = "2010/setup-lightweight-imap-server-macos-leopard-dovecot"
id = 769311810
author = "Kevin Deldycke"
wp_id = 7333
date = 2010-08-25T13:03:00Z
body = '''
I've just tried to install dovecot 1.2.11 from MacPorts on Mac OS X Snow Leopard (10.6).

If the whole procedure is the same, I had to modify the `dovecot.conf` file differently. Here is my version of it:

```diff
--- /opt/local/etc/dovecot/dovecot-example.conf2010-08-24 21:06:11.000000000 +0200
+++ /opt/local/etc/dovecot/dovecot.conf2010-08-25 02:13:25.000000000 +0200
@@ -21,7 +21,7 @@

 # Protocols we want to be serving: imap imaps pop3 pop3s
 # If you only want to use dovecot-auth, you can set this to "none".
-#protocols = imap imaps
+protocols = imap imaps

 # A space separated list of IP or host addresses where to listen in for
 # connections. "*" listens in all IPv4 interfaces. "[::]" listens in all IPv6
@@ -221,7 +221,7 @@
 #
 # <doc/wiki/MailLocation.txt>
 #
-#mail_location =
+mail_location = maildir:~/Maildir

 # If you need to set multiple mailbox locations or want to change default
 # namespace settings, you can do it by defining namespace sections.
@@ -904,7 +904,7 @@
     # Some examples:
     #   args = session=yes %Ls
     #   args = cache_key=%u dovecot
-    #args = dovecot
+    args = login
   }

   # System users (NSS, /etc/passwd, or similiar)
```

Note that this connect the authentication to the system-wide [PAM](https://en.wikipedia.org/wiki/OpenPAM). So you have to connect to your local IMAP server on `localhost:143` and with the credentials of your Mac user account.
'''

[[comment]]
article = "2010/setup-lightweight-imap-server-macos-leopard-dovecot"
id = 769311816
parent = 769311810
author = "jemow"
wp_id = 10918
date = 2013-01-06T19:56:00Z
body = '''
In addition to adding `"args = login"`, I also had to copy `/etc/pam.d/ftpd` to `/etc/pam.d/dovecot`:

```text
auth       required       pam_opendirectory.so
account    required       pam_permit.so
password   required       pam_deny.so
session    required       pam_permit.so
```
'''

