[[comment]]
article = "2008/heroic-journey-to-raid-5-data-recovery"
id = 769311418
author = "Endre"
wp_id = 10707
date = 2012-05-17T02:21:00Z
body = '''
Thanks for this post it helped me a lot.

In my case 1 had 4 drives (`sd[a-d]`):

- `sda` and `sdb` are 250G `c` and `d` are 160G
- `sda1` and `sdb1` (200m each) as raid1 `md0` for `/boot`
- `sd[ab]2` and `sd[cd]1` as raid5 `md1` for LVM providing root and else.

The problem was that `sd[ab]2` were both ~250G regardless the uselessness regarding the other members of the array. So I decided to take out `sda2`, delete the partition, create a 160G sized and an `sda3` for the rest, put `sda2` it back to `md1`, leave it to rebuild. Then do the same with `sdb` so I get `sd[ab]3` to form a raid1 array.

Everything went well, except for I disregarded the notifications of `partprobe` (after altering `sda` and `sdb` with `fdisk`) and even the alternation was complete, after reboot the startup failed to find the root device.

Booting up with a livecd it turned out that both `sda2` and `sdb2` were kicked out of the array. After a short panic I found this post, and tried to collect some information.

```bash
mdadm -E /dev/sd{a2,b2,c1,d1} | grep Event
```

It turned out, that `sda2` were completely faulty but the rest were ok, though `mdadm` denied to add it to the array.

Long story short, this was the solution:

```bash
mdadm --create -l5 -n4 --assume-clean /dev/md1 missing /dev/sdb2 /dev/sdc1 /dev/sdd1
```

It showed clean,degraded,. I was half relieved this point, because I could not mount it! Anyway I continued, zeroed `sda2`, added to the array and left it to rebuild. It worked!

Although since create changed the `uuid` of the array I had to reconfigure some other things, such as `mdadm.conf`, `grub.conf`, `fstab`, but that's an other story ...

Thanks again!
'''

