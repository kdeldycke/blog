[[comment]]
article = "2006/e107-to-wordpress-migration-here-is-why"
id = 769308958
parent = 769308956
author = "Kevin Deldycke"
wp_id = 92
date = 2006-08-31T03:12:00Z
body = '''
Hi Rik,

To be honest, I discovered [ecaptcha plugin](https://www.greycube.com/blog/169) several hours after I published this article, when the [v1.6 was released on e107coders.org](https://web.archive.org/web/20060924124220/http://www.e107coders.org/download.php?view.1399).

The captcha solution is good for the short term (let anonymous post comments) but I don't like this solution for the mid/long term, for two reasons:

- It is annoying for the user: it require extra input,
- [It's not hard to defeat captcha.](https://en.wikipedia.org/wiki/CAPTCHA#Circumvention)

That's why I still prefer Akismet solution and its collaborative / social networking approach.
'''

