article = "2009/how-to-install-eaccelerator-php5-debian-lenny"
id = 769311620
author = "Lars"
wp_id = 6813
date = 2010-01-13T05:26:00Z
body = '''
**HowTo install "eAccelerator" from sources:**

Link:
[http://voku-online.de/comment-n134.html](https://web.archive.org/web/20100125151108/http://voku-online.de:80/comment-n134.html)

```bash
aptitude install build-essential php5-dev
cd /usr/src/
wget http://bart.eaccelerator.net/source/0.9.5.3/eaccelerator-0.9.5.3.tar.bz2
tar xvfj eaccelerator-0.9.5.3.tar.bz2
cd eaccelerator-0.9.5.3
phpize
./configure
make
make install
vim /etc/php5/conf.d/eaccelerator.ini
```

```ini
extension="eaccelerator.so"
eaccelerator.shm_size="16"
eaccelerator.cache_dir="/var/cache/eaccelerator"
eaccelerator.enable="1"
eaccelerator.optimizer="1"
eaccelerator.check_mtime="1"
eaccelerator.debug="0"
eaccelerator.filter=""
eaccelerator.shm_max="0"
eaccelerator.shm_ttl="0"
eaccelerator.shm_prune_period="0"
eaccelerator.shm_only="0"
eaccelerator.compress="1"
eaccelerator.compress_level="9"
```

```bash
mkdir -p /var/cache/eaccelerator
chmod 0777 /var/cache/eaccelerator
/etc/init.d/apache2 restart
```
'''

