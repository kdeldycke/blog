# How-to extract data trapped into an iPhone

[[comment]]
article = "2010/how-to-extract-data-trapped-iphone"
id = 769312094
author = "Kevin Deldycke"
wp_id = 7393
date = 2010-09-23T18:06:00Z
body = '''
Here is the list of stuff worth saving and their location:

- Photos: `/iOS Files/Media/DCIM/XXXAPPLE/*.JPG`
- Voice messages: `/iOS Files/Library/Voicemail/*.amr`
- Voice messages metadatas: `/iOS Files/Library/Voicemail/voicemail.db`
- Safari bookmarks: `/iOS Files/Library/Safari/Bookmarks.db`
- Safari history: `/iOS Files/Library/Safari/History.plist`
- Safari currently opened tabs: `/iOS Files/Library/Safari/SuspendState.plist`
- Contacts: `/iOS Files/Library/AddressBook/AddressBook.sqlitedb`
- Notes: `/iOS Files/Library/Notes/notes.sqlite`
- Call history: `/iOS Files/Library/CallHistory/call_history.db`
- Calendar: `/iOS Files/Library/Calendar/Calendar.sqlitedb`
- SMSs: `/iOS Files/Library/SMS/sms.db`

As you can see datas are clean and tidy. That’s quite easy to find what your looking for.

BTW, diving into 2 years of data is great and scary at the same time. While browsing all the data extracted from my iPhone, I realized how much sensitive and personal informations are collected and stored. I knew about these issues. But looking at raw data is quite enlightening regarding privacy and security.
'''

