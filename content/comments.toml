id = 769312009
author = "Kevin Deldycke"
wp_id = 7441
date = 2010-10-18T23:08:00Z
body = '''
BTW, if you get the following error:

```text
C:\Python26\lib\site-packages\icalendar\prop.py:980: DeprecationWarning: object.__init__() takes no parameters
  unicode.__init__(self, *args, **kwargs)
```

it means that you're using an old version of the `icalendar` library. To fix this, get the [latest version from PyPi](https://pypi.org/project/icalendar/).
'''

[[comment]]
article = "2010/convert-lotus-notes-nsf-files-mbox-nlconverter"
id = 769312018
author = "Kevin Deldycke"
wp_id = 7442
date = 2010-10-18T23:28:00Z
body = '''
Another error you might encounter, is this one:

```text
python.exe - Entry Point Not Found

The procedure entry point ?PyWinGlobals_Ensure@@YAHXZ could not be located in the dynamic link library pywintypes26.dll
```

It may appear when you try to run the `notes2mbox.py` script within the `nlconverter`'s main folder. This is due to precompiled libraries conflicting with the ones present on your system.

The fix for me was to delete all `*.pyd` and `*.dll` files located in the `C:\winnlc-alpha-1\` folder.
'''

