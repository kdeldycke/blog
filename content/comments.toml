body = '''
Thanks for a great plugin. I've been using it for a few months, but just buckled down and figure out how to polish some things up on the CSS following this post.

I used a slight variation as I wanted to use some wider images (more rectangular).

Thought I'd share my css in case it helps someone else move through things faster... :)

Note I used width of 230px and height of 120px 75 words for titles and no excerpts.

```css
#crp_related ul {
  list-style: none;
  float: left;
  margin: 1px;
}
#crp_related li, #crp_related a {
  float: left;
  overflow: hidden;
  position: relative;
  text-align: center;
}
#crp_related li {
  margin: .9em;
  border: 0px solid #ddd;
  padding: 6px;
}
#crp_related li:hover {
  background: #eee;
  border-color: #bbb;
}
#crp_related a {
  width: 230px;
  height: 165px;
  margin-bottom: 10px;
}
#crp_related a:hover {
  text-decoration: none;
}
#crp_related img {
  max-width: 230px;
  margin: auto;
}
#crp_related .crp_title {
  position: absolute;
  height: inherit;
  bottom: 0px;
  left: 0px;
  padding: 3px;
  width: 224px;  /* = 230px - (3px * 2) */
  color: #fff;
  font-size: 1.1em;
  text-shadow: #000 .1em .1em .2em;
  background: rgb(0.5, 0.5, 0.5);
  background: rgba(0, 0, 0, 0.5);
}
#crp_related li:hover .crp_title {
  background: rgb(0.2, 0.2, 0.2);
  background: rgba(0, 0, 0, 0.8);
}
```
'''

