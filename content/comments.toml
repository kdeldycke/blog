[[comment]]
article = "2020/revert-hp-printer-ban-on-third-party-ink-cartridges"
id = 6353105655
author = "Stefan"
date = 2023-12-27T13:13:00Z
body = '''
Thanks for your instruction. For my setup, the `lpr` command didn't work as provided. It always ended up in an error:

```shell-session
myname@myname ~ % lpr -P HP OfficeJet Pro 8710 /Users/myname/Downloads/OJP8710_2105AR.rfu
lpr: No such file or directory
```

As far as I understand, the `-P` parameter is to define the name of the printer to which the print command shall be sent. But obviously I didn't manage to call my printer correctly.
I replaced it with the following to make it work. I guess it sends the file directly to the default printer.

```bash
lpr -l /Users/myname/Downloads/OJP8710_2105AR.rfu
```

My setup:
HP OfficeJet 8710
MacOS 14.2.1

Now I can use refilled cartridges again :)
'''

