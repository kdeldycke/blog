date = 2012-09-06T00:30:00Z
body = '''
I was lucky in that my swap partition was next to my root partition. After increasing raw img size using `truncate`, I booted into single user mode, used `fdisk -cu /dev/vda` to edit my partition table. Created new swap partition, deleted old swap partition, deleted root partion, made new partion allowing it to take up all the space. Set boot flag. Wrote table to disk. Ran `partx -a /dev/vda` to make it active. Then used `resize2fs /dev/vda1` to grow the root partition to fill up the space vacated by the old swap partition.
'''

