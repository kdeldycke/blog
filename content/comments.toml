id = 769312543
author = "Kevin Deldycke"
wp_id = 8394
date = 2011-02-17T21:10:00Z
body = '''
I just got a strange error today while pushing a new set of changes in Subversion. Here is the log message after I did a `dcommit`:

```shell-session
$ git svn dcommit
(...)
        M       e107-importer.php
        M       e107-redirector.php
r344145 = fca814dc060ed112796075431ca12a298a37460b (refs/remotes/trunk)
        M       e107-importer.php
r344147 = 2823094482c69291649901012a571ff578073cdd (refs/remotes/trunk)
W: 8fe2934d1552c97246836987f0ea08e10ba749ae and refs/remotes/trunk differ, using rebase:
:000000 100755 0000000000000000000000000000000000000000 28befb1834cee062b3cbe40e357b361ebfc8c77d A      e107-importer.php
:000000 040000 0000000000000000000000000000000000000000 6eac685dafcc65ef82e8ece46903dfa031e96f99 A      e107-includes
:000000 100755 0000000000000000000000000000000000000000 4f76882edf86309181685ad84016df8627e262af A      e107-redirector.php
:000000 100755 0000000000000000000000000000000000000000 72b5868f1510d9c2fec02c2546b3c7356eb0f9ff A      readme.txt
:000000 100644 0000000000000000000000000000000000000000 c3a4766e24d21d1af908100b734d9be6111f4f09 A      screenshot-1.png
:000000 100644 0000000000000000000000000000000000000000 60e411f121214adfb7eabd8ecbe7605d464b60ef A      screenshot-2.png
:000000 100644 0000000000000000000000000000000000000000 c9f2f967714f8000caf5db2d0b019975dfefb3bb A      screenshot-3.png
:000000 100644 0000000000000000000000000000000000000000 eb595744eb181cfb581eeca4c95b5b6f47011fb0 A      screenshot-4.png
First, rewinding head to replay your work on top of it...
Applying: Add dummy support of forums import.
Using index info to reconstruct a base tree...
Falling back to patching base and 3-way merge...
Auto-merging e107-importer.php
CONFLICT (content): Merge conflict in e107-importer.php
Auto-merging e107-redirector.php
CONFLICT (content): Merge conflict in e107-redirector.php
Auto-merging readme.txt
CONFLICT (content): Merge conflict in readme.txt
Failed to merge in the changes.
Patch failed at 0001 Add dummy support of forums import.

When you have resolved this problem run "git rebase --continue".
If you would prefer to skip this patch, instead run "git rebase --skip".
To restore the original branch and stop rebasing run "git rebase --abort".

rebase refs/remotes/trunk: command returned error: 1
```

I'm not sure of the origin of the problem, but I managed to fix this by doing:

```shell-session
$ git rebase --skip
$ git svn dcommit
```
'''

