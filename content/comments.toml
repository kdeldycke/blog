# How I initialize my Git repositories

[[comment]]
article = "2010/initialize-git-repositories"
id = 769311721
author = "Kevin Deldycke"
wp_id = 8184
date = 2011-01-18T21:29:00Z
body = '''
I'm starting to get an idea of the initial commit problem. And [according Brandon Dimcheff](https://web.archive.org/web/20100528131109/http://brandon.dimcheff.com:80/2009/01/04/commit-a-linear-git-history-to-subversion.html), it looks like a `--root` option was [added to Git](https://git.kernel.org/pub/scm/git/git.git/commit/?id=190f53232d1e92a57843df90e889bcfea39620d3) to address this issue.

And here is an [example I found on Stack Overflow](https://stackoverflow.com/questions/645450/git-how-to-insert-a-commit-as-the-first-shifting-all-the-others/4716997#4716997) on how to use it:

```bash
git rebase --root --onto $emptyrootcommit
```
'''

[[comment]]
article = "2010/initialize-git-repositories"
id = 769311726
author = "Kevin Deldycke"
wp_id = 8601
date = 2011-04-12T16:28:00Z
body = '''
If you need to automate the setting of the initial commit's date, then add the `init` tag just after the `git commit` command.

This will let you get the hash of the first commit dynamically:

```shell-session
$ git commit --allow-empty -m 'Initial commit'
$ git tag "init"
$ export GIT_TMP_INIT_HASH=`git show-ref init | cut -d ' ' -f 1`
$ git filter-branch --env-filter '
    if [ $GIT_COMMIT = $GIT_TMP_INIT_HASH ]
      then
        export GIT_AUTHOR_DATE="Thu, 01 Jan 1970 00:00:00 +0000"
        export GIT_COMMITTER_DATE="Thu, 01 Jan 1970 00:00:00 +0000"
    fi' -- --all
$ unset GIT_TMP_INIT_HASH
```
'''

[[comment]]
article = "2010/initialize-git-repositories"
id = 769311734
parent = 769311726
author = "David"
wp_id = 10821
date = 2012-07-06T00:19:00Z
body = '''
Here's a cleaner way than using `filter-branch` to set the commit date of your first commit to epoch start:

```shell-session
$ GIT_AUTHOR_DATE="Thu, 01 Jan 1970 00:00:00 +0000"
$ GIT_COMMITTER_DATE="Thu, 01 Jan 1970 00:00:00 +0000"
$ git commit --allow-empty -m 'Initial commit'
```
'''

[[comment]]
article = "2010/initialize-git-repositories"
id = 797080077
parent = 769311734
author = "John"
date = 2013-02-12T23:01:00Z
body = '''
`git-commit` has a `--date` option.

```bash
git commit --allow-empty -m 'Initial commit' --date 1970-01-01T00:00:00
```
'''

[[comment]]
article = "2010/initialize-git-repositories"
id = 3214254590
parent = 797080077
author = "Sylvie"
date = 2017-03-21T00:05:00Z
body = '''
`--date` option only adjusts the "authorDate" and does not adjust the "commitDate". The only way to adjust the "commitDate" is via the `GIT_COMMITTER_DATE` environment variable.
'''

[[comment]]
article = "2010/initialize-git-repositories"
id = 784657885
