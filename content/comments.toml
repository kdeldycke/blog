# Fuse and sshfs on Mac OS X Leopard

[[comment]]
article = "2009/fuse-sshfs-macosx-leopard"
id = 769311628
author = "Rich"
wp_id = 6508
date = 2009-10-14T19:33:00Z
body = '''
Here's a question I haven't been able to find an answer to:

There seems to be no way to tell the "sshfs" command (in any environment) to use a private key file named something OTHER than `id_rsa`.

Most people who use `ssh` to connect to multiple machines set up separate public/private key pairs with unique file names for each connection. The "ssh" command lets you specify a particular private key file name on the command line, and the `~/.ssh/config` configuration file lets you define particular private key file names to be referenced by named connections.

But... there is no command line option in "sshfs" to specify a particular private key file name, and `sshfs` does not seem to read the `~/.ssh/config` file to get named connection information. It seems really wrong to force people to use a single key file to remote-mount folders from multiple systems (`ssh` was designed so this didn't have to be the case). Why doesn't `sshfs` either provide a command line option to specify a different key file name besides `id_rsa`, or have the smarts to read named connection information from `~/.ssh/config` ?
'''

