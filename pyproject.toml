  #   --> ./content/2010/making-info-tgv-android-app-video.md:68:154
  #    |
  # 68 | ... me his Shure Beta57A microphone ...
  #    |            ^^^^^
  #    |
  "Shure ",
  # error: `shure` should be `sure`
  #   --> ./content/2010/making-info-tgv-android-app-video.md:70:13
