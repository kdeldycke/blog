[project]
# Docs: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
name = "blog"
version = "1.0.0"
# Kept byte-identical to the GitHub repository description: `lint-repo` compares the
# two with a plain `!=`, with no normalization, so a stray emoji shortcode or a
# trailing full stop on one side is a failed check. Change both or neither.
description = "My personal blog, and the yak-shaving that keeps two decades of URLs alive."
readme = "readme.md"
keywords = [
  "atom-feed",
  "blog-posts",
  "blog-source",
  "creative-commons",
  "dev-blog",
  "markdown-blog",
  "myst",
  "myst-markdown",
  "myst-parser",
  "pelican",
  "pelican-blog",
  "pelican-site",
  "personal-blog",
  "personal-site",
  "python-blog",
  "static-blog",
  "static-website",
  "technical-blog",
  "wrangler",
  "yak-shaving",
]
license = { text = "CC-BY-NC-SA-4.0" }
# A floor rather than a compatibility claim, and the only Python control in the repo.
# Nothing here needs 3.14 and the corpus built fine on 3.12, but this blog has one
# contributor and one pipeline, so the range never describes anyone else's
# environment: it says what CI should run, and it is the newest release because the
# newest release is the fastest.
#
# Being a floor and not a pin is the point. uv takes the first compatible interpreter
# it finds, so a new minor is adopted on its own once runners and wheels carry it,
# which is the intent here rather than something to guard against. There is
# deliberately no `.python-version`: it would fix the version and have to be bumped by
# hand, and no updater walks it forward.
#
# What this does rule out is the older failure: uv can no longer fall back to whatever
# `/usr/bin/python3` a runner image ships, which is how the build spent its life on
# 3.12.3 without anyone choosing it. Narrowing the range also let the resolver drop
# every older-Python branch from the lock.
#
# The cost is one upstream pin per bump. 3.14 needed pelican-search 1.1.1, whose
# predecessor capped rtoml below the release that first shipped cp314 wheels. Expect
# to go hunting for the equivalent when 3.15 lands.
requires-python = ">=3.14"
classifiers = [
  # See: https://pypi.org/pypi?%3Aaction=list_classifiers
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Pelican",
  "License :: Other/Proprietary License",
  "Natural Language :: English",
  "Natural Language :: French",
  "Operating System :: OS Independent",
  "Programming Language :: Other",
  "Programming Language :: Python :: 3 :: Only",
  # Only 3.14, matching the `requires-python` floor above. Resolvers read that floor and
  # humans read these, so a list reaching down to 3.10 advertised support for four
  # versions the project refuses to install on. `lint-repo` flags the disagreement.
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
dependencies = [
  "pelican[Markdown]>=4.10",
  "pelican-neighbors>=1.2",
  "pelican-search>=1.1",
  "pelican-seo>=1.2.2",
  # "pelican-similar-posts ~= 1.0.0",  # XXX Broken!
  "pelican-sitemap>=1.1",
  "plumage>=5",
  "typogrify>=2.0.7",
  # "gensim ~= 4.3.0",  # XXX Broken!
]
optional-dependencies.test = [
  "pytest>=8.3.2",
  # More pytest plugins at: https://docs.pytest.org/en/latest/reference/plugin_list.html
  "pytest-github-actions-annotate-failures>=0.2",
  "pytest-randomly>=3.15",
  # Most of this suite waits on the network rather than on a CPU: every rule in
  # `_redirects` and every rule in `_headers` is one live request to production. That
  # is the workload xdist is best at, and it takes the local run from about four
  # minutes to under three.
  #
  # The psutil extra is what makes `--numprocesses=logical` available, should the
  # split ever want tuning beyond physical cores.
  "pytest-xdist[psutil]>=3.7",
  "requests>=2.32.3",
]
optional-dependencies.typing = [ "types-requests>=2.32.0.20240622" ]
urls.Funding = "https://github.com/sponsors/kdeldycke"
urls.Homepage = "https://kevin.deldycke.com"
urls.Repository = "https://github.com/kdeldycke/blog"

[tool.uv]
# Both pins below are repomatic's, written by `repomatic init uv` and left alone
# afterwards. Floor uv rather than cap it: astral-sh/setup-uv reads `required-version`
# directly and installs the newest release satisfying it, so a ceiling would break every
# machine the day the next minor lands.
required-version = ">=0.11.15"
# pelican caps pygments at `<2.20.0`, and 2.20.0 is the release fixing CVE-2026-4539, so
# this repo's Dependabot alert sits out of reach of an ordinary resolution: uv keeps 2.18.0
# without complaining and `fix-vulnerable-deps` has nothing to propose. The cap is
# deliberate, not a stale ceiling, and the reasons are worth reading before touching this
# line: https://github.com/getpelican/pelican/issues/3586 and /issues/3608. Upstream rates
# the CVE low risk (local access only, in the ADL lexer this blog never reaches), notes it
# is disputed at https://github.com/pygments/pygments/issues/3058, and declines to
# re-baseline pelican's own functional test fixtures against 2.20's markup.
#
# That last objection is pelican's, not this blog's. Comparing the two versions directly:
# 2.20 wraps inter-token whitespace in `<span class="w"> </span>`, which every bundled style
# colors as ordinary text, and it uppercases the hex colors in the generated stylesheets.
# Neither reaches a rendered page, so I take the upgrade and close the alert.
#
# Remove once pelican widens the cap. `lint-deps` flags this key by design; the
# `lint-deps.allow` entry under `[tool.repomatic]` demotes that warning to a note carrying
# the reason.
override-dependencies = [ "pygments>=2.20" ]
# Cooldown before a newly published package can be resolved, held equal to
# `[tool.repomatic] minimum-release-age` so the window here never excludes a version the
# `uvx` installs in CI would pick. Until this landed the cooldown came from
# ~/.config/uv/uv.toml alone, which is one machine's config and does not travel: a fresh
# clone resolved with no window at all.
exclude-newer = "1 week"
package = false

[tool.typos]
