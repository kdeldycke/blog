# Exclude French articles.
files.extend-exclude = [
  "content/2004/mise-en-place-paserelle-adsl-mandrake-10.md",
  "content/2005/creer-un-espace-de-stockage-fiable-avec-raid-5-et-lvm-sous-linux.md",
  "content/2005/script-de-reconnection-automatique-ppp.md",
  "content/2006/ajouter-une-entree-jack-universelle-sur-un-telephone-sagem-my700xi.md",
  "content/2009/cool-cavemen-creative-commons-moi.md",
  "content/2010/comment-supprimer-des-comptes-mails-secondaires-free-fr.md",
  "content/2012/ovh-configuration-modem-thomson-tg585-ipoe.md",
]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
pretty = true
warn_unused_configs = true
overrides = [
  # Pelican ships no py.typed marker, so importing it is an error under the settings above.
  # Silenced here rather than with an inline ignore on each import, because every local
  # workaround in pelican_patches.py has to reach into the engine to hook onto it. Drop
  # this once Pelican starts advertising its own types.
  { module = [ "pelican.*" ], ignore_missing_imports = true },
]

[tool.pytest]
# The tests import pelicanconf and pelican_patches, which sit at the repository root.
# This project is not a package (see [tool.uv] below), so there is nothing installed for
# them to be imported from: pytest only puts the test file's own folder on sys.path, and
# from tests/ that no longer covers the root. Needed for the `pytest` console script CI
# runs, which unlike `python -m pytest` does not prepend the working directory.
ini_options.pythonpath = [ "." ]
# https://docs.pytest.org/en/latest/customize.html#pyproject-toml
# `--numprocesses=auto` splits the run across cores. It pays off because the suite is
# mostly live HTTP against production, so workers spend their time waiting rather than
# competing, and it costs a fraction of a second on the offline files.
#
# It only works because every test ID is deterministic. xdist compares what each worker
# collected and aborts the whole run when they disagree, which is what the generated
# redirect cases used to cause: they drew their placeholder values from the global
# random state at collection time, so every worker invented different URLs. `token()`
# in `test_redirects.py` seeds off the rule instead. Keep it that way, or this flag
# turns every run into "Different tests were collected between gw0 and gw1".
ini_options.addopts = [ "--durations=10", "--numprocesses=auto" ]
# Make sure tests that are expected to fail do not resurect and start working all of a sudden.
ini_options.xfail_strict = true

[tool.lychee]
# Since v0.24 lychee reads this table straight out of pyproject.toml, so repomatic runs no
# translation step and performs no merge: whatever is written here is the whole policy, and
# declaring the table at all is what discards repomatic/data/lychee.toml. The bundled
# entries are therefore restated below rather than inherited. Everything from `archive.ph`
# down is a verbatim copy; only the first entry is specific to this repo.
exclude = [
  # Pelican's internal link markers are resolved at build time, so they only ever exist
  # in the Markdown source. lychee reads that source and rewrites `]({attach}foo.jpg)`
  # into `file://.../%7Battach%7Dfoo.jpg`, a path nothing on disk answers to. Left alone
  # that is ~690 phantom failures across 164 posts, enough to bury a real one. Matching
  # the encoded braces rather than the literal `{attach}` is deliberate: the check runs
  # after lychee has already percent-encoded them.
  "%7B(attach|author|category|filename|index|static|tag)%7D",
  # GitHub issue comment fragments are dynamically loaded and can't be verified.
  "^https://github.com/.+/issues/[0-9]+#issuecomment-.*$",
  # Release binary download URLs redirect to the GitHub CDN (objects.githubusercontent.com).
  "^https://github.com/.+/releases/.+/download/.*$",
  # Allow redirects of generic DOI URLs to their specific Zenodo release page.
  "^https://doi.org/.+/zenodo.*$",
  # Skip archive.ph and Sci-Hub because they restrict access to crawlers.
  # Skip HN because of rate-limiting.
  # See: https://github.com/lycheeverse/lychee/issues/989#issuecomment-1587208730
  # https://github.com/lycheeverse/lychee/pull/1147
  "archive\\.ph",
  "sci-hub\\.st",
  "ycombinator\\.com",
  "x\\.com",
  # Same story as x.com above, and this corpus predates the rename: 29 links still point
  # at the old domain, which answers a crawler with a login wall. Not in the bundled
  # config, which covers repositories whose prose is younger than the rename.
  "twitter\\.com",
  # VirusTotal analysis pages are a JS app that rate-limits bots, and the
  # binaries page links one per released binary.
  "^https://www\\.virustotal\\.com/gui/.*$",
]

[tool.repomatic]
# `bumpversion.sync = false` used to sit here, because `sync-bumpversion` gated on
# `is_python_project`, true for any repo carrying a [project] table, and so fired against
# this `[tool.uv] package = false` project with nothing to version. v7.10.0 moved the job
# onto the narrower `is_python_package`, which is false here, so the opt-out no longer
# describes anything.
# The release lane used to be listed here too: changelog, changelog.yaml, release.yaml
# and publish-pypi-action. RepoScope.PACKAGE_ONLY now keeps all four away from a
# `[tool.uv] package = false` project on its own, so naming them only restated what
# repomatic already works out, exactly as the codecov entry did before it went.
# debug.yaml is the one that stays: it is PYTHON_ONLY, and this repo really is a Python
# project. It just has nothing to debug, being a Pelican toolchain rather than a package.
exclude = [
  "workflows/debug.yaml",
]
# `sync-gitignore` rebuilds .gitignore from gitignore.io and appends this key, in that
# order and nothing else: the file on disk is never read. So the Pelican rules below only
# survive by being declared here, and until they were, they sat in the generated file
# waiting to be overwritten. Losing `output` would have dropped 194 MB of rendered site
# into `git status`, and into the next `git add -A`.
# Setting the key replaces the default wholesale rather than extending it, so repomatic's
# own entries are restated. `docs/_linkcheck/` is the one left out: it belongs to a Sphinx
# tree this repo does not have. `.cc-writes/` is repomatic's own addition rather than a
# bundled default, and is worth carrying: Claude Code drops that staging directory into
# whichever tree it is launched from.
gitignore.extra-content = """
# Claude Code local files.
.claude/scheduled_tasks.lock
.claude/settings.local.json
**/.claude/.cc-writes/

# Pelican.
*.pid
output
seo_report.html

# Cloudflare.
# `wrangler` writes a local state directory into whichever tree it is run from.
.wrangler/
# The virtualenv template gitignore.io emits above ignores `[Ss]cripts`, aimed at a
# venv's Windows `Scripts/` folder. It also swallows this repo's own `scripts/`, so
# `scripts/cloudflare_config.py` silently refuses to be added. Re-included here, which
# only works because extra-content is appended after the generated rules.
!scripts/
"""
# `lint-deps` flags `[tool.uv] override-dependencies` on principle: an override rewrites the
# resolution for whoever locks the project and for nobody else, so a package ships tested
# against a tree its users never get. That consequence needs a package, and this one is
# `[tool.uv] package = false`: the tree the override produces is the only tree anyone ever
# installs. Naming it here demotes that warning to a note carrying the reason, so the next
# reader gets the argument instead of a bare finding. The full story sits beside the
# override itself.
lint-deps.allow = { pygments = "no published artifact: the overridden tree is the only one that ships" }
# Declared rather than inherited, even though `1 week` is repomatic's own default. This
# window is restated in three hand-held copies: `[tool.uv] exclude-newer` above, and the
# `UV_EXCLUDE_NEWER` and `NPM_CONFIG_MIN_RELEASE_AGE` literals in tests.yaml and
# deploy.yaml. Held equal to a default, they would all silently fall out of step the day
# upstream moves it, and nothing here would say what they were meant to equal. Writing it
# down is what makes the other three checkable.
minimum-release-age = "1 week"
# The default filter is written for a repo whose prose lives in docs/ and readme.md. Here
# the prose is the product: every post is under content/, so without it below a new article
# ships without ever having its links checked. An override rather than extra_paths because
# extra_paths only appends, and two of the defaults need removing, not supplementing:
# changelog.md and citation.cff name files this repo does not have. An override replaces
# the default outright, so what follows is the entire filter.
workflow.paths."docs.yaml" = [
  ".github/workflows/docs.yaml",
  "content/**",
  "docs/**",
  "pyproject.toml",
  "readme.md",
  "uv.lock",
  "**/*.py",
]
# Same reasoning, and the same reason the default misses: source_paths derives from
# [project] name, so the stock filter watches blog/**, a directory this repo does not
# have. Both jobs below key off content/: one builds the site from it, the other reads
# the redirect map out of content/extra/.
# The root .py files are named rather than globbed. That started as a workaround for a
# repomatic bug that emitted a `**/*.py` override unquoted, which YAML reads as an alias
# and GitHub answers by dropping the workflow; v7.7.0 fixed it and a glob would be safe
# again. Keeping the names anyway, because for a repo holding two Python files at its root
# a list is more honest than a pattern: adding a third should be a deliberate edit here.
# pelican_patches.py joined the list when the local Pelican workarounds moved out of
# pelicanconf.py: it runs on every build, so a change to it has to re-run the tests.
# The suite itself is globbed, since pytest discovers it the same way.
workflow.paths."tests.yaml" = [
  ".github/workflows/tests.yaml",
  "content/**",
  "pelican_patches.py",
  "pelicanconf.py",
  "pyproject.toml",
  "tests/**",
  "uv.lock",
]
