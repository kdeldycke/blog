# Direct-upload project: deploy.yaml builds the site and ships it with
# `wrangler pages deploy ./output`, so Cloudflare never runs a build of its own.
# `pages_build_output_dir` and `compatibility_date` are required keys in a Pages
# config, so they stay even though nothing reads them here: with no Pages Functions
# there is no Workers runtime for the compatibility date to pin. Dropping either
# downgrades this file to local-development-only.
#
# The date below is kept equal to the live `deployment_configs.*.compatibility_date`
# that Cloudflare actually honours, so the repository states one value rather than
# two. It sat at 2023-03-01 for years while the live value moved on, and nothing
# caught it. Two checks catch it now: `lint-repo` compares the date below with
# `[tool.repomatic] site.cloudflare-compatibility-date`, and `repomatic
# cloudflare-pages --check` compares that key with the live value.
name = "kevin-deldycke-blog"
pages_build_output_dir = "output"
compatibility_date = "2026-06-16"
send_metrics = false
